
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İyi ki Doğdun Aşkım ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: radial-gradient(circle, #57152f, #210817 75%);
    color: white;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
}

/* İLK KARŞILAMA EKRANI */

.intro {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: radial-gradient(circle, #601b3b, #180713 75%);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 25px;
    transition: opacity 1s, visibility 1s;
}

.intro.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    animation: introAppear 1.5s ease;
}

@keyframes introAppear {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

.intro-heart {
    font-size: 65px;
    margin-bottom: 20px;
    animation: heartbeat 1.3s infinite;
}

.intro h2 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(40px, 7vw, 65px);
    color: #ffb6ce;
    margin-bottom: 15px;
}

.intro p {
    color: #f8dce7;
    letter-spacing: 2px;
    font-size: 13px;
    margin-bottom: 35px;
}

.start-button {
    border: none;
    padding: 16px 35px;
    border-radius: 35px;
    background: linear-gradient(135deg, #ff477e, #a83268);
    color: white;
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,71,126,.5);
    transition: .3s;
}

.start-button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px rgba(255,71,126,.8);
}

/* ANA SAYFA */

#mainSite {
    display: none;
}

.container {
    min-height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 115px 20px 100px;
    text-align: center;
}

.content {
    position: relative;
    z-index: 5;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(48px, 7vw, 85px);
    color: #ffb6ce;
    text-shadow: 0 0 25px rgba(255,105,160,.6);
    margin-bottom: 15px;
}

.subtitle {
    font-size: 16px;
    letter-spacing: 4px;
    color: #ffe0eb;
    margin-bottom: 20px;
}

.names {
    font-size: 25px;
    letter-spacing: 7px;
    color: #ff8fb5;
    margin-top: 15px;
}

.center-heart {
    font-size: 45px;
    animation: heartbeat 1.3s infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
}

/* FOTOĞRAFLAR */

.photo {
    position: absolute;
    width: 185px;
    height: 225px;
    padding: 10px 10px 35px;
    background: #fff9f5;
    border-radius: 3px;
    box-shadow: 0 10px 35px rgba(0,0,0,.5);
    z-index: 2;
    transition: .4s;
}

.photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.photo:hover {
    transform: scale(1.12) rotate(0deg);
    z-index: 10;
}

.photo1 { top: 12%; left: 12%; transform: rotate(-9deg); }
.photo2 { top: 12%; right: 12%; transform: rotate(8deg); }
.photo3 { top: 39%; left: 7%; transform: rotate(-7deg); }
.photo4 { top: 39%; right: 7%; transform: rotate(7deg); }
.photo5 { bottom: 5%; left: 19%; transform: rotate(7deg); }
.photo6 { bottom: 5%; right: 19%; transform: rotate(-7deg); }
.photo7 {
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%) rotate(3deg);
}

/* MEKTUP BUTONU */

.letter-button {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 25px;
    background: linear-gradient(135deg, #ff477e, #a83268);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    box-shadow: 0 0 20px rgba(255,71,126,.5);
    transition: .3s;
    white-space: nowrap;
    z-index: 20;
}

.letter-button:hover {
    transform: translateX(-50%) scale(1.08);
}

/* MÜZİK BUTONU */

.music-button {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 30;
    border: none;
    border-radius: 30px;
    padding: 12px 18px;
    background: #ff477e;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

/* KALPLER */

.floating-heart {
    position: fixed;
    bottom: -30px;
    color: rgba(255,130,170,.5);
    animation: floatUp 9s linear infinite;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    from { transform: translateY(0) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    to { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}

/* TELEFON */

@media (max-width: 650px) {
    .container {
        min-height: 100vh;
        padding: 140px 15px 170px;
    }

    .photo {
        width: 105px;
        height: 135px;
        padding: 6px 6px 23px;
    }

    .photo1 { top: 17%; left: 3%; }
    .photo2 { top: 17%; right: 3%; }
    .photo3 { top: 43%; left: 1%; }
    .photo4 { top: 43%; right: 1%; }
    .photo5 { bottom: 5%; left: 5%; }
    .photo6 { bottom: 5%; right: 5%; }
    .photo7 { bottom: 3%; left: 50%; }

    h1 { font-size: 48px; }

    .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
    }

    .names {
        font-size: 17px;
        letter-spacing: 4px;
    }

    .letter-button {
        top: 30px;
        font-size: 12px;
        padding: 11px 19px;
    }
}
</style>
</head>

<body>

<!-- İLK EKRAN -->

<div class="intro" id="intro">
    <div class="intro-content">
        <div class="intro-heart">❤️</div>
        <h2>Küçük bir sürprize hazır mısın?</h2>
        <p>SENİN İÇİN ÇOK ÖZEL BİR ŞEY HAZIRLADIM</p>
        <button class="start-button" onclick="startSurprise()">
            HAZIR MISIN? ❤️
        </button>
    </div>
</div>

<!-- ANA SAYFA -->

<div id="mainSite">

    <div class="container">

        <a href="mektup.html" class="letter-button">
            💌 SANA BİR MEKTUBUM VAR
        </a>

        <div class="photo photo1"><img src="1.jpeg" alt="Anımız 1"></div>
        <div class="photo photo2"><img src="2.jpeg" alt="Anımız 2"></div>
        <div class="photo photo3"><img src="3.jpeg" alt="Anımız 3"></div>
        <div class="photo photo4"><img src="7.jpeg" alt="Anımız 4"></div>
        <div class="photo photo5"><img src="6.jpeg" alt="Anımız 5"></div>
        <div class="photo photo6"><img src="5.jpeg" alt="Anımız 6"></div>
        <div class="photo photo7"><img src="4.jpeg" alt="Anımız 7"></div>

        <div class="content">
            <div class="center-heart">❤️</div>

            <h1>DOĞUM GÜNÜN KUTLU OLSUN AŞKIM</h1>

            <div class="subtitle">
                İYİ Kİ DOĞDUN, İYİ Kİ HAYATIMDASIN
            </div>

            <div class="names">
                GÖZDE & ÖZGÜR
            </div>
        </div>

    </div>

    <button class="music-button" id="musicButton" onclick="toggleMusic()">
        🎵 Müziği Aç
    </button>

</div>

<audio id="music" src="şarkı.mp3" loop></audio>

<script>
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

function startSurprise() {
    document.getElementById("intro").classList.add("hide");
    document.getElementById("mainSite").style.display = "block";

    music.play().then(() => {
        musicButton.textContent = "🔇 Müziği Kapat";
    }).catch(() => {
        musicButton.textContent = "🎵 Müziği Aç";
    });
}

function toggleMusic() {
    if (music.paused) {
        music.play();
        musicButton.textContent = "🔇 Müziği Kapat";
    } else {
        music.pause();
        musicButton.textContent = "🎵 Müziği Aç";
    }
}

/* UÇUŞAN KALPLER */

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "floating-heart";
    heart.textContent = Math.random() > 0.5 ? "❤️" : "♡";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";
    heart.style.animationDuration = (6 + Math.random() * 6) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 12000);
}

setInterval(createHeart, 650);
</script>

</body>
</html>
